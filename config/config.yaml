trading:
  symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCAD
  - AUDUSD
  - NZDUSD
  - XAUUSD
  - BTCUSD
  - US30
  - NAS100
  timeframes:
  - M5
  - M15
  - H1
  automation_mode: auto
  allowed_trade_direction: BOTH
  order_block_scan_enabled: true
  allowed_market_types:
  - Forex
risk_management:
  default_risk_percent: 2.5
  max_daily_loss_percent: 6.0
  max_open_positions: 3
  exclude_closed_markets_from_quota: true
  max_positions_per_symbol: 1
  max_lot_size: 1.0
  min_confidence: 60.0
  min_reward_risk: 1.5
  break_even_enabled: true
  break_even_ratio: 0.45
  trailing_stop_enabled: true
  trailing_stop_atr_mult: 1.5
  min_profit_to_close_ratio: 0.5
  max_ob_per_initial_trade: 1
  dollar_trailing_enabled: true
  min_profit_to_protect_usd: 2.5
  giveback_usd_small: 0.9
  giveback_usd_medium: 1.8
  giveback_usd_large: 3.0
  daily_profit_target_usd: 50.0
  stop_trading_on_daily_target: true
  take_profit_target_per_trade_usd: 4.0
  spread_buffer_enabled: true
  max_spread_sl_ratio: 0.25
  spread_buffer_max_cap: 0.4
  risk_profile: SNIPER
  auto_tier_enabled: true
  max_micro_risk_cap_percent: 4.0
  daily_profit_target_percent: 6.0
ai_models:
  openrouter_model: google/gemma-4-26b-a4b-it:free
  gemini_model: gemini-3.8-flash
  router_cooldown_seconds: 900
  live_news_enabled: false
ui:
  theme: dark
  update_interval_ms: 1000
  trade_manager_interval_ms: 3000
voice:
  enabled: true
  voice_name: Microsoft Julie
  rate: 0.02
  pitch: 0.05
  volume: 1.0
  auto_adapt_on_danger: true
  voice_announcements: true
