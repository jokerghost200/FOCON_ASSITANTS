trading:
  symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCAD
  - AUDUSD
  - NZDUSD
  - XAUUSD
  - BTCUSD
  - US30
  - NAS100
  timeframes:
  - M15
  - H1
  - H4
  automation_mode: auto
  allowed_trade_direction: BOTH
  order_block_scan_enabled: true
  post_trade_ob_rescan_enabled: false
  allowed_market_types:
  - Forex
crt:
  enabled: true
  htf: H1
  ltf: M15
  swing_lookback: 2
  mss_max_bars: 3
  entry_mode: fvg_midpoint
  atr_period: 14
  sl_atr_mult: 0.1
  min_rr: 1.5
  fallback_tp_r: 2.0
  expiration_bars: 4
  risk_per_trade_pct: 0.25
  use_pending_orders: true
risk_management:
  default_risk_percent: 2.0
  max_daily_loss_percent: 8.0
  max_open_positions: 1
  exclude_closed_markets_from_quota: true
  max_positions_per_symbol: 1
  max_lot_size: 1.0
  min_confidence: 75.0
  min_reward_risk: 2.5
  break_even_enabled: true
  break_even_ratio: 0.5
  trailing_stop_enabled: true
  trailing_stop_atr_mult: 2.0
  min_profit_to_close_ratio: 0.5
  max_ob_per_initial_trade: 1
  dollar_trailing_enabled: false
  min_profit_to_protect_usd: 25.0
  giveback_usd_small: 2.0
  giveback_usd_medium: 10.0
  giveback_usd_large: 15.0
  daily_profit_target_usd: 50.0
  stop_trading_on_daily_target: true
  take_profit_target_per_trade_usd: 0.0
  spread_buffer_enabled: true
  max_spread_sl_ratio: 0.25
  spread_buffer_max_cap: 0.4
  risk_profile: AGGRESSIVE
  auto_tier_enabled: false
  max_micro_risk_cap_percent: 6.0
  daily_profit_target_percent: 5.0
  fixed_lot_size: 1.2
  manual_max_positions_override: true
ai_models:
  openrouter_model: google/gemma-4-26b-a4b-it:free
  gemini_model: gemini-3.8-flash
  router_cooldown_seconds: 900
  live_news_enabled: false
ui:
  theme: dark
  update_interval_ms: 1000
  trade_manager_interval_ms: 3000
voice:
  enabled: true
  voice_name: Microsoft Julie
  rate: 0.02
  pitch: 0.05
  volume: 1.0
  auto_adapt_on_danger: true
  voice_announcements: true
